
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------- CI: FRONTEND ----------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ---------------- CI: BACKEND ----------------
  backend:
    name: Backend check and smoke test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      DB_NAME: cinema_booking
      JWT_SECRET: ci-test-secret
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          for f in src/*.js; do
            node --check "$f"
          done

      - name: Start MongoDB
        working-directory: .
        run: docker run -d --name cinema-ci-mongo -p 27017:27017 mongo:7.0.41
        
      - name: Wait for MongoDB
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            if docker exec cinema-ci-mongo mongosh --quiet --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB failed to start"
          docker logs cinema-ci-mongo
          exit 1

      - name: Start backend and test health endpoint
        run: |
          node src/server.js > server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3000/api/health; then
              echo
              echo "Backend health check passed"
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend stopped unexpectedly"
              break
            fi

            sleep 1
          done

          echo "Backend health check failed"
          cat server.log
          exit 1

      - name: Show MongoDB logs on failure
        if: failure()
        working-directory: .
        run: docker logs cinema-ci-mongo 2>&1 | tail -50

  # ---------------- CD: PUBLISH DOCKER IMAGES ----------------
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest

    needs: [frontend, backend]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO}-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
