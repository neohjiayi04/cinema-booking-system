services:
  mongodb:
    image: mongo:8
    container_name: cinema-mongodb-new
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"   # DB reachable from this host only; backend uses the Docker network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build: ./backend
    container_name: cinema-backend-new
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: cinema_booking
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:5174
      CINEMA_TIMEZONE: Asia/Kuala_Lumpur
      SHOWTIME_CLEANING_MINUTES: 20
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cinema-frontend-new
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data: