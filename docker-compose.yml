services:
  mongodb:
    image: mongo:8
    container_name: cinema-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: cinema-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/cinema_booking
      DB_NAME: cinema_booking
      JWT_SECRET: ci-test-secret
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: cinema-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
